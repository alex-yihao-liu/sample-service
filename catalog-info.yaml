apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: self-healing-lab
  description: Local AI-assisted incident detection and remediation lab
spec:
  owner: group:guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-service
  description: .NET eShop API used by the AIOps incident lab
  annotations:
    aiops.io/namespace: demo
    aiops.io/deployment: sample-service
    github.com/project-slug: alex-yihao-liu/sample-service
    backstage.io/source-location: url:https://github.com/alex-yihao-liu/sample-service
    backstage.io/kubernetes-id: sample-service
    backstage.io/kubernetes-namespace: demo
    jira.com/project-key: AIOPS
  links:
    - url: https://github.com/alex-yihao-liu/sample-service
      title: GitHub Repository
      icon: github
    - url: https://github.com/alex-yihao-liu/sample-service/actions
      title: GitHub Actions
      icon: dashboard
    - url: http://localhost:3001
      title: Grafana
      icon: dashboard
    - url: http://localhost:9090
      title: Prometheus
      icon: dashboard
    - url: http://localhost:3000/incidents
      title: Incident Manager
      icon: dashboard
    - url: http://api.192.168.1.222.nip.io/openapi.json
      title: eShop API
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: user:guest
  system: self-healing-lab
  providesApis:
    - sample-service-shop-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sample-service-shop-api
  description: Product, cart and order API exposed by sample-service
spec:
  type: openapi
  lifecycle: experimental
  owner: user:guest
  system: self-healing-lab
  definition:
    $text: http://sample-service.demo.svc/openapi.json
