apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: self-healing-lab
  description: Local AI-assisted incident detection and remediation lab
spec:
  owner: group:guests
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-service
  description: Sample service used by the AI self-healing incident lab
  annotations:
    aiops.io/namespace: demo
    aiops.io/deployment: sample-service
    github.com/project-slug: alex-yihao-liu/sample-service
    backstage.io/source-location: url:https://github.com/alex-yihao-liu/sample-service
  links:
    - url: https://github.com/alex-yihao-liu/sample-service
      title: GitHub Repository
      icon: github
    - url: https://github.com/alex-yihao-liu/sample-service/actions
      title: GitHub Actions
      icon: dashboard
    - url: http://localhost:3001
      title: Grafana
      icon: dashboard
    - url: http://localhost:9090
      title: Prometheus
      icon: dashboard
    - url: http://localhost:3000/incidents
      title: Self-Healing Incidents
      icon: dashboard
    - url: http://localhost:8000/docs
      title: Todo API Swagger
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: user:guest
  system: self-healing-lab
  providesApis:
    - sample-service-todo-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sample-service-todo-api
  description: Todo List CRUD API exposed by sample-service
spec:
  type: openapi
  lifecycle: experimental
  owner: user:guest
  system: self-healing-lab
  definition:
    $text: http://sample-service.demo.svc/openapi.json
