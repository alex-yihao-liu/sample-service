name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64, aioops-local, kind]

    defaults:
      run:
        shell: powershell

    env:
      REGISTRY: 192.168.1.222:30500
      IMAGE_REPOSITORY: sample-service
      KUBE_CONTEXT: default
      EXPECTED_KUBE_SERVER: https://192.168.1.222:6443

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          docker version
          kubectl version --client

      - name: Verify 222 access
        run: |
          $server = kubectl --context $env:KUBE_CONTEXT config view --minify -o jsonpath="{.clusters[0].cluster.server}"
          if ($server -ne $env:EXPECTED_KUBE_SERVER) {
            throw "Refusing to deploy to '$server'. Expected '$env:EXPECTED_KUBE_SERVER'."
          }

          $registryHealth = Invoke-WebRequest -UseBasicParsing -Uri "http://$env:REGISTRY/v2/" -TimeoutSec 10
          if ($registryHealth.StatusCode -ne 200) {
            throw "Registry health check failed with status $($registryHealth.StatusCode)."
          }

      - name: Prepare image tag
        run: |
          $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
          $imageTag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT-$timestamp"
          $imageName = "$env:REGISTRY/$env:IMAGE_REPOSITORY`:$imageTag"
          $stableImageName = "$env:REGISTRY/$env:IMAGE_REPOSITORY`:todo-postgres"
          "IMAGE_TAG=$imageTag" >> $env:GITHUB_ENV
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV
          "STABLE_IMAGE_NAME=$stableImageName" >> $env:GITHUB_ENV
          "BUILD_ID=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          Write-Host "Image: $imageName"

      - name: Build Docker image
        run: |
          docker build `
            --tag $env:IMAGE_NAME `
            --tag $env:STABLE_IMAGE_NAME `
            .

      - name: Push Docker image to 222 registry
        run: |
          docker push $env:IMAGE_NAME
          docker push $env:STABLE_IMAGE_NAME

      - name: Deploy to 222 Kubernetes
        run: |
          kubectl --context $env:KUBE_CONTEXT apply -f D:\AIOps\kubernetes\sample-service.yaml
          kubectl --context $env:KUBE_CONTEXT set image deployment/sample-service sample-service=$env:IMAGE_NAME -n demo
          kubectl --context $env:KUBE_CONTEXT annotate deployment/sample-service -n demo `
            aiops.io/build-id=$env:BUILD_ID `
            aiops.io/image-tag=$env:IMAGE_TAG `
            aiops.io/github-run-id=$env:GITHUB_RUN_ID `
            aiops.io/github-run-number=$env:GITHUB_RUN_NUMBER `
            aiops.io/github-sha=$env:GITHUB_SHA `
            --overwrite
          kubectl --context $env:KUBE_CONTEXT rollout status deployment/sample-service -n demo --timeout=180s

      - name: Verify deployment
        run: |
          kubectl --context $env:KUBE_CONTEXT get deployment/sample-service -n demo -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""
          kubectl --context $env:KUBE_CONTEXT get pods -n demo -l app=sample-service
          kubectl --context $env:KUBE_CONTEXT get svc -n demo sample-service
