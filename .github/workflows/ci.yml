name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64, aioops-local, kind]

    defaults:
      run:
        shell: powershell

    env:
      IMAGE_REPOSITORY: sample-service
      KIND_CLUSTER_NAME: self-healing-lab
      KUBE_CONTEXT: kind-self-healing-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          docker version
          kind version
          kubectl version --client

      - name: Prepare image tag
        run: |
          $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
          $imageTag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT-$timestamp"
          $imageName = "$env:IMAGE_REPOSITORY`:$imageTag"
          "IMAGE_TAG=$imageTag" >> $env:GITHUB_ENV
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV
          "BUILD_ID=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
          Write-Host "Image: $imageName"

      - name: Build Docker image
        run: |
          docker build `
            --tag $env:IMAGE_NAME `
            --build-arg HTTP_PROXY=http://host.docker.internal:7890 `
            --build-arg HTTPS_PROXY=http://host.docker.internal:7890 `
            --build-arg http_proxy=http://host.docker.internal:7890 `
            --build-arg https_proxy=http://host.docker.internal:7890 `
            .

      - name: Load image into kind
        run: |
          kind load docker-image $env:IMAGE_NAME --name $env:KIND_CLUSTER_NAME

      - name: Deploy to local Kubernetes
        run: |
          kubectl config use-context $env:KUBE_CONTEXT
          kubectl apply -f D:\AIOps\kubernetes\sample-service.yaml
          kubectl set image deployment/sample-service sample-service=$env:IMAGE_NAME -n demo
          kubectl annotate deployment/sample-service -n demo `
            aiops.io/build-id=$env:BUILD_ID `
            aiops.io/image-tag=$env:IMAGE_TAG `
            aiops.io/github-run-id=$env:GITHUB_RUN_ID `
            aiops.io/github-run-number=$env:GITHUB_RUN_NUMBER `
            aiops.io/github-sha=$env:GITHUB_SHA `
            --overwrite
          kubectl rollout status deployment/sample-service -n demo --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment/sample-service -n demo -o jsonpath="{.spec.template.spec.containers[0].image}"
          Write-Host ""
          kubectl get pods -n demo -l app=sample-service
          kubectl get svc -n demo sample-service
